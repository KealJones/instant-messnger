<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>Instant Mess'nger</title>
    <meta name="description" content="Everyone types into one bubble at once. Nothing is saved." />
    <link rel="stylesheet" href="style.css" />
    <script>try{var t=localStorage.getItem("im:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <main id="join" class="join" hidden>
      <h1 class="sr-only">Instant Mess'nger</h1>
      <form id="join-form" class="join-form">
      <label for="name" class="sr-only" id="name-label">your name</label>
      <input id="name" maxlength="24" required autocomplete="nickname" autocapitalize="off" spellcheck="false" />
      <button type="submit" id="join-btn" aria-label="Join">→</button>
      </form>
    </main>

    <main id="app" class="app" hidden>
      <h1 class="sr-only">Instant Mess'nger</h1>
      <header class="top">
        <button id="room" class="room" type="button"></button>
        <span id="conn" class="conn" role="img"></span>
        <button id="theme" class="theme" type="button"></button>
      </header>

      <section class="stage">
        <div id="bubble" class="bubble empty" dir="auto"><span id="text"></span><span class="caret" aria-hidden="true"></span></div>
      </section>

      <footer class="bottom">
        <ul id="people" class="people"></ul>
      </footer>

      <input
        id="type"
        class="capture"
        aria-describedby="rules"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        enterkeyhint="send"
      />
      <p id="rules" class="sr-only"></p>
      <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
